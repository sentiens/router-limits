name: test
on:
  push:
  pull_request:
jobs:
  test:
    # macOS: the plugin's launcher is zsh, and the tests use the BSD userland.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
